name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-gnu
            bin: ipatool-kit
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            bin: ipatool-kit
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            bin: ipatool-kit.exe
          # One modern macOS runner builds arm64 + x86_64 (Apple linker, no macos-13).
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bin: ipatool-kit

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra targets <<< "${{ matrix.rust_targets }}"
          for target in "${targets[@]}"; do
            cargo build -p ipa-downloader --release --target "$target"
            src="target/${target}/release/${{ matrix.bin }}"
            out="dist/ipatool-kit-${target}"
            if [[ "${{ matrix.bin }}" == *.exe ]]; then
              out="${out}.exe"
            fi
            cp "$src" "$out"
            echo "Staged $out"
          done
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-kit-${{ matrix.name }}
          path: dist/*

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bins
          merge-multiple: true

      - name: List binaries
        run: find release-bins -type f -print

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-bins/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
