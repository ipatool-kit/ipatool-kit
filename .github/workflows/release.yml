name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ipatool-kit
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: ipatool-kit
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ipatool-kit.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: ipatool-kit
          - os: macos-13
            target: x86_64-apple-darwin
            bin: ipatool-kit

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build -p ipa-downloader --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p ipa-downloader --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          OUT="dist/ipatool-kit-${{ matrix.target }}"
          if [[ "${{ matrix.bin }}" == *.exe ]]; then
            OUT="${OUT}.exe"
          fi
          cp "$SRC" "$OUT"
          echo "Staged $OUT"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-kit-${{ matrix.target }}
          path: dist/*

  publish:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bins
          merge-multiple: true

      - name: List binaries
        run: find release-bins -type f -print

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-bins/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
