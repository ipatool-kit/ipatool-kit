[workspace]
resolver = "2"
members = [
    "crates/ipatool",
    "crates/ipa-downloader",
]
default-members = ["crates/ipatool", "crates/ipa-downloader"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.0.0"
authors = ["ipatool-kit contributors"]

[workspace.dependencies]
ipatool = { path = "crates/ipatool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
plist = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
crossterm = "0.28"
zip = { version = "2", default-features = false, features = ["deflate"] }
ipatool-core = "0.1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
