[package]
name = "ipatool-kit-core"
version = "0.2.0"
edition = "2024"
description = "App Store auth, purchase, and download core used by ipatool-kit (SAP + Configurator flow)"
license = "MIT"
repository = "https://github.com/ipatool-kit/ipatool-kit"
homepage = "https://github.com/ipatool-kit/ipatool-kit"
readme = "README.md"
keywords = ["ios", "app-store", "ipa", "sap", "apple"]
categories = ["api-bindings"]
include = [
    "src/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[lib]
name = "ipatool_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
bzip2 = "0.6"
cookie_store = "0.21"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
getrandom = "0.3"
indicatif = "0.17"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
libloading = "0.8"
mac_address = "1"
phf = { version = "0.11", features = ["macros"] }
plist = "1"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream"] }
reqwest_cookie_store = "0.8"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = "0.22"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tracing = "0.1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
